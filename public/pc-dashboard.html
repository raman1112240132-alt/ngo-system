<!DOCTYPE html>
<html>

<head>
<title>PC Dashboard</title>
</head>

<body>

<h2>Program Coordinator Dashboard</h2>

<table border="1" id="dashboardTable">

<tr>
<th>Yellow Room</th>
<th>Date</th>
<th>Sessions Logged</th>
<th>Status</th>
</tr>

</table>

<script>

async function loadDashboard(){

const res = await fetch("/pc-dashboard-data");
const data = await res.json();

const table = document.getElementById("dashboardTable");

data.forEach(d => {

let row = table.insertRow();

row.insertCell(0).innerText = d.yellow_room;
row.insertCell(1).innerText = d.date;
row.insertCell(2).innerText = d.sessions_logged;

let statusCell = row.insertCell(3);
statusCell.innerText = d.status;

// 🎨 COLOR LOGIC
if(d.status === "Complete"){
statusCell.style.color = "green";
}
else if(d.status === "Partial"){
statusCell.style.color = "orange";
}
else{
statusCell.style.color = "red";
}

});

}

loadDashboard();

</script>

</body>

</html>
