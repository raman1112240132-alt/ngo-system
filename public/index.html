<th>Batch</th>
<th>Subject</th>

</tr>
</table>

<br>

<script>

// AUTO DATE
document.getElementById("date").value = new Date().toISOString().split("T")[0];

// SORT DROPDOWN
function sortDropdown(){
let dropdown = document.getElementById("room");
let options = Array.from(dropdown.options).slice(1);
options.sort((a,b)=>a.text.localeCompare(b.text));
dropdown.innerHTML='<option value="">Select Yellow Room</option>';
options.forEach(o=>dropdown.add(o));
}
sortDropdown();

// ROOM TYPE AUTO
const roomTypeMapping = {
"One world":"Shalimar Sites",
"Garden Bay":"Shalimar Sites",
"Mannat":"Shalimar Sites",
"Malhaur":"10-15 Years",
"Chinhat":"10-15 Years",
"Munshipulia":"10-15 Years",
"Ismailganj":"5-10 Years"
};

document.getElementById("room").addEventListener("change", function(){
document.getElementById("roomType").value =
roomTypeMapping[this.value] || "1-5 Years";
});

// SPECIAL SUBJECTS
const specialSubjects = [
"Games","Library","Library Session",
"Children Panchayat","Animal Management",
"Padho Padhao","PTM"
];

// =============================
// SIMPLE WORKING TIMETABLE
// =============================
const timetable0 = {
1:[{batch:"Tenderfeet",subject:"Linguistic"},{batch:"Learners",subject:"Maths"},{batch:"Advancers",subject:"Science"}],
2:[{batch:"Tenderfeet",subject:"Maths"},{batch:"Learners",subject:"EVS"},{batch:"Advancers",subject:"Maths"}],
3:[{batch:"Learners",subject:"Games"},{batch:"Advancers",subject:"Children Panchayat"}],
4:[{batch:"Tenderfeet",subject:"Library Session"},{batch:"Learners",subject:"SEL Plans"}],
5:[{batch:"Tenderfeet",subject:"Yoga"},{batch:"Advancers",subject:"Games"}],
6:[{batch:"Learners",subject:"WHY"},{batch:"Learners",subject:"GA"}],
7:[{batch:"Tenderfeet",subject:"Linguistic"}],
8:[{batch:"Tenderfeet",subject:"Maths"}],
9:[{batch:"Learners",subject:"SEL Plans"}],
10:[{batch:"Learners",subject:"Cleanliness Session"}],
11:[{batch:"Advancers",subject:"Games"}],
12:[{batch:"Learners",subject:"WHY"},{batch:"Learners",subject:"GA"}],
13:[{batch:"Tenderfeet",subject:"Linguistic"}],
14:[{batch:"Tenderfeet",subject:"Linguistic"}],
15:[{batch:"Learners",subject:"SEL Plans"}],
16:[{batch:"Learners",subject:"Gender Session"}],
17:[{batch:"Advancers",subject:"Games"}],
18:[{batch:"Learners",subject:"WHY"},{batch:"Learners",subject:"GA"}],
19:[{batch:"Tenderfeet",subject:"Library Session"}],
20:[{batch:"Tenderfeet",subject:"Gender Session"}],
21:[{batch:"Learners",subject:"SEL Plans"}],
22:[{batch:"Learners",subject:"Games"}],
23:[{batch:"Learners",subject:"PTM"}],
24:[{batch:"Learners",subject:"WHY"},{batch:"Learners",subject:"GA"}]
};

// LOAD DAY
function loadDay(){

const week = document.getElementById("weekSelect").value;
const day = document.getElementById("daySelect").value;

if(!week || !day){
alert("Select Week & Day");
return;
}

const globalDay = (week - 1) * 6 + Number(day);
let data = timetable0[globalDay] || [];

const table = document.getElementById("dailyTable");

table.innerHTML = `
<tr>
<th>Batch</th>
<th>Subject</th>
<th>Chapter</th>
<th>Index</th>
<th>Lesson</th>
</tr>
`;

data.forEach(d => {

let row = table.insertRow();
row.insertCell(0).innerText = d.batch;
row.insertCell(1).innerText = d.subject;

let c = row.insertCell(2);
let i = row.insertCell(3);
let l = row.insertCell(4);

if(specialSubjects.includes(d.subject)){
c.innerHTML = `<select><option></option><option>1</option><option>0</option></select>`;
i.innerText = "-";
l.innerText = "-";
}else{
c.innerHTML = `<select><option>Select Chapter</option></select>`;
i.innerHTML = `<select><option>Select Index</option></select>`;
l.innerText = "";
}

});

}

</script>

</body>
</html>
