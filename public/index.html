document.getElementById("date").value =
new Date().toISOString().split("T")[0];

document.getElementById("execDate").value =
new Date().toISOString().split("T")[0];

sortRooms();

};

// SORT ROOMS
function sortRooms(){
let dropdown = document.getElementById("room");
let options = Array.from(dropdown.options).slice(1);

options.sort((a,b)=>a.text.localeCompare(b.text));

dropdown.innerHTML = '<option value="">Select Yellow Room</option>';
options.forEach(opt=>dropdown.add(opt));
}

};

// TRANSFORM
function transform(type,data){
let x=[...data];

if(type==="1"||type==="2"){
x=x.filter(d=>d.s!=="FLN");
}

if(type==="3"){
let adv=x.filter(d=>d.b==="Advancers");
let asp=adv.map(d=>({b:"Aspirers",s:d.s}));
x=[...x,...asp];
}

if(type==="S"){
x.unshift({b:"Tenderfeet Slot 2",s:"Maths"});
}

return x;
}

// LOAD
function loadDay(){

let day = parseInt(document.getElementById("daySelect").value);
let type = document.getElementById("roomType").value;

if(!day || !type){
  alert("Please select Room Type and Day");
  return;
}

let data = [];

// SELECT CORRECT TIMETABLE
if(type === "0"){
  data = timetable0[day] || [];
}
else if(type === "1"){
  data = timetable1_5[day] || [];
}
else if(type === "2"){
  data = timetable5_10[day] || [];
}
else if(type === "3"){
  data = timetable10[day] || [];
}
else if(type === "S"){
  data = timetableShalimar[day] || [];
}

if(data.length === 0){
  alert("No timetable found for this day");
  return;
}

// LOAD TABLE
let table = document.getElementById("table");

table.innerHTML = `
<tr>
<th>Batch</th>
<th>Subject</th>
<th>Chapter</th>
<th>Index</th>
<th>Lesson</th>
</tr>
`;

data.forEach(d => {

let row = table.insertRow();

row.insertCell(0).innerText = d.b;
row.insertCell(1).innerText = d.s;

// SPECIAL SUBJECT
if(special.includes(d.s)){

row.insertCell(2).innerHTML = `
<select>
<option value="">Select</option>
<option value="1">1</option>
<option value="0">0</option>
</select>
`;

row.insertCell(3).innerText = "-";
row.insertCell(4).innerText = "-";

}
else{

row.insertCell(2).innerHTML = `<select><option>Select Chapter</option></select>`;
row.insertCell(3).innerHTML = `<select><option>Select Index</option></select>`;
row.insertCell(4).innerHTML = `<input type="text">`;

}

});

}

// SAVE
function save(){

let educator=document.getElementById("educator").value;
let date=document.getElementById("execDate").value;

if(!educator||!date){
alert("Fill required fields");
return;
}

let rows=document.querySelectorAll("#table tr");
let data=[];

for(let i=1;i<rows.length;i++){

let c=rows[i].querySelectorAll("td");

let chapter="",index="",lesson="";

// SPECIAL SUBJECT CHECK
if(c[2].querySelector("select") && c[3].innerText==="-"){

chapter=c[2].querySelector("select").value;

if(chapter===""){
alert("Please select 1 or 0 for all special sessions");
return;
}

index="-";
lesson="-";

}else{

chapter=c[2].querySelector("select")?.value||"";
index=c[3].querySelector("select")?.value||"";
lesson=c[4].querySelector("input")?.value||"";

}

data.push({
batch:c[0].innerText,
subject:c[1].innerText,
chapter,
index,
lesson
});

}
