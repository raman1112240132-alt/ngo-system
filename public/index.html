<!DOCTYPE html>
<html>
<head>
<title>YR Lesson Plan MIS</title>

<style>
body{font-family:Arial;background:#f5f7fb;margin:0;}
h2{background:#1f2937;color:#fff;padding:15px;margin:0;}
.container{padding:20px;}

select,input{padding:8px;margin:5px;border-radius:6px;border:1px solid #ccc;}

button{padding:10px 16px;border:none;border-radius:6px;cursor:pointer;font-weight:bold;}
.load-btn{background:#facc15;}
.save-btn{background:#16a34a;color:white;}
.save-btn:hover{background:#15803d;}

table{width:100%;border-collapse:collapse;margin-top:20px;background:white;}
th{background:#111827;color:#facc15;padding:10px;}
td{padding:8px;border:1px solid #ddd;}

.badge{padding:3px 8px;border-radius:6px;font-size:12px;font-weight:bold;}
.t{background:#dbeafe;}
.l{background:#dcfce7;}
.a{background:#fee2e2;}
.s{background:#fce7f3;}

.special{background:#ede9fe;}

.success{background:#d1fae5;padding:10px;margin-top:10px;display:none;}
</style>
</head>

<body>

<h2>YR Lesson Plan MIS</h2>

<div class="container">

<input type="text" id="educator" placeholder="Educator Name">
<input type="date" id="date">

<br>

<select id="room">
<option value="">Select Yellow Room</option>
<option>Malhaur</option>
<option>Chinhat</option>
<option>Munshipulia</option>
<option>Garden Bay</option>
<option>Mannat</option>
<option>One world</option>
<option>Ismailganj</option>
<option>Abhay Nagar</option>
<option>Bahadurpur</option>
</select>

<select id="roomType">
<option value="">Yellow Room Type</option>
<option value="0">0 Years</option>
<option value="1">1-5 Years</option>
<option value="2">5-10 Years</option>
<option value="3">10-15 Years</option>
<option value="S">Shalimar</option>
</select>

<br>

<select id="weekSelect">
<option value="">Select Week</option>
<option value="1">Week 1</option>
<option value="2">Week 2</option>
<option value="3">Week 3</option>
<option value="4">Week 4</option>
</select>

<select id="daySelect">
<option value="">Select Day</option>
</select>

<button class="load-btn" onclick="loadDay()">Load Day</button>

<table id="table">
<tr>
<th>Batch</th>
<th>Subject</th>
<th>Chapter</th>
<th>Index</th>
<th>Lesson</th>
</tr>
</table>

<br>

<label>Execution Date:</label>
<input type="date" id="execDate">

<br><br>

<button class="save-btn" onclick="save()">Save Full Day</button>

<div id="msg" class="success">Saved Successfully ✅</div>

</div>

<script>

// AUTO DATE
document.getElementById("date").value =
new Date().toISOString().split("T")[0];

// ROOM TYPE AUTO
const roomMap = {
"Malhaur":"3",
"Chinhat":"3",
"Munshipulia":"3",
"Ismailganj":"2",
"Garden Bay":"S",
"Mannat":"S",
"One world":"S"
};

document.getElementById("room").addEventListener("change", function(){
document.getElementById("roomType").value = roomMap[this.value] || "1";
});

// WEEK → DAY (1–24)
document.getElementById("weekSelect").addEventListener("change", function(){
let w = this.value;
let d = document.getElementById("daySelect");

d.innerHTML='<option>Select Day</option>';

let start = (w-1)*6+1;

for(let i=0;i<6;i++){
d.innerHTML+=`<option value="${start+i}">Day ${start+i}</option>`;
}
});

// HELPERS
const TF=s=>({b:"Tenderfeet",s});
const LN=s=>({b:"Learners",s});
const AV=s=>({b:"Advancers",s});
const AS=s=>({b:"Aspirers",s});

// SPECIAL SUBJECTS
const special=[
"Games","Library Session","Children Panchayat",
"Animal Management","Padho Padhao","PTM",
"Cleanliness Session","Gender Session","SEL Plans",
"Yoga","Drawing","WHY","GA"
];

// BASE (0 YEAR CORE)
const base={
1:[TF("Linguistic"),TF("Maths"),TF("Naitik Shiksha"),LN("FLN"),LN("Linguistic"),LN("Maths"),LN("Naitik Shiksha"),AV("Maths"),AV("Linguistic"),AV("Science")],
3:[TF("Linguistic"),TF("Maths"),TF("Cleanliness Session"),LN("FLN"),LN("Linguistic"),LN("Maths"),LN("Naitik Shiksha"),AV("Maths"),AV("Linguistic"),AV("Science")],
4:[TF("Linguistic"),TF("Maths"),TF("Library Session"),LN("FLN"),LN("Linguistic"),LN("Maths"),LN("SEL Plans"),AV("Maths"),AV("Naitik Shiksha"),AV("Science")],
5:[TF("Linguistic"),TF("EVS"),TF("Yoga"),LN("FLN"),LN("Library Session"),LN("EVS"),LN("Children Panchayat"),LN("Animal Management"),AV("Gender Session"),AV("Yoga"),AV("Games")],
6:[TF("Drawing"),TF("EVS"),TF("Games"),LN("WHY"),LN("GA"),LN("Yoga"),LN("EVS"),LN("Drawing"),AV("WHY"),AV("GA"),AV("Drawing"),AV("Library Session")]
};

// TRUE 24 DAY MAP
const timetable={
1:base[1],2:base[1],3:base[3],4:base[4],5:base[5],6:base[6],
7:base[1],8:base[1],9:base[1],10:base[4],11:base[5],12:base[6],
13:base[1],14:base[1],15:base[1],16:base[4],17:base[5],18:base[6],
19:base[4],20:base[1],21:base[4],22:base[3],23:base[5],24:base[6]
};

// TYPE TRANSFORM
function transform(type, data){

let x = [...data];

// 1–5 & 5–10 → remove FLN
if(type==="1" || type==="2"){
  x = x.filter(d => d.s !== "FLN");
}

// ✅ FIXED Aspirers logic
if(type==="3"){

  // get only Advancers subjects
  let advancers = x.filter(d => d.b === "Advancers");

  // create Aspirers from Advancers ONLY
  let aspirers = advancers.map(d => ({
    b: "Aspirers",
    s: d.s
  }));

  x = [...x, ...aspirers];
}

// Shalimar → Tenderfeet Slot 2
if(type==="S"){
  x.unshift({ b:"Tenderfeet Slot 2", s:"Maths" });
}

return x;
}

// LOAD DAY
function loadDay(){

let day=document.getElementById("daySelect").value;
let type=document.getElementById("roomType").value;

if(!day||!type){
alert("Select Room Type & Day");
return;
}

let data=transform(type,timetable[day]);

let table=document.getElementById("table");

table.innerHTML=`<tr>
<th>Batch</th>
<th>Subject</th>
<th>Chapter</th>
<th>Index</th>
<th>Lesson</th>
</tr>`;

data.forEach(d=>{

let row=table.insertRow();

let c=d.b==="Tenderfeet"?"t":d.b==="Learners"?"l":d.b==="Advancers"?"a":"s";

row.insertCell(0).innerHTML=`<span class="badge ${c}">${d.b}</span>`;
row.insertCell(1).innerHTML=`<span class="${special.includes(d.s)?'special':''}">${d.s}</span>`;

if(special.includes(d.s)){
row.insertCell(2).innerHTML='<select><option>1</option><option>0</option></select>';
row.insertCell(3).innerText="-";
row.insertCell(4).innerText="-";
}else{
row.insertCell(2).innerHTML='<select><option>Select Chapter</option></select>';
row.insertCell(3).innerHTML='<select><option>Select Index</option></select>';
row.insertCell(4).innerHTML='<input>';
}

});

}

// SAVE (REAL DATA)
function save(){

let educator=document.getElementById("educator").value;
let date=document.getElementById("execDate").value;
let day=document.getElementById("daySelect").value;
let type=document.getElementById("roomType").value;

if(!educator||!date){
alert("Fill Educator Name & Execution Date");
return;
}

let rows=document.querySelectorAll("#table tr");
let data=[];

rows.forEach((row,i)=>{
if(i===0) return;

let cells=row.querySelectorAll("td");

data.push({
batch:cells[0].innerText,
subject:cells[1].innerText,
chapter:cells[2].innerText,
index:cells[3].innerText,
lesson:cells[4].innerText
});

});

let finalData={educator,date,day,type,data};

let blob=new Blob([JSON.stringify(finalData,null,2)],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="YR_Data.json";
a.click();

document.getElementById("msg").style.display="block";

setTimeout(()=>{
document.getElementById("msg").style.display="none";
},2000);

}

</script>

</body>
</html>
