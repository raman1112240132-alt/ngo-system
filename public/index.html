</select>

<!-- ✅ FIXED TABLE -->
<table border="1" id="dailyTable">
<tr>
<th>Batch</th>
<th>Subject</th>
<th>Chapter</th>
<th>Index</th>
<th>Lesson</th>
</tr>
</table>

<br>

<button onclick="saveDay()">Save Full Day</button>

<script>

// AUTO DATE
document.getElementById("date").value =
new Date().toISOString().split("T")[0];

// ROOM TYPE AUTO
const roomTypeMapping = {
"One world":"Shalimar Sites",
"Garden Bay":"Shalimar Sites",
"Mannat":"Shalimar Sites",
"Chinhat":"10-15 Years"
};

document.getElementById("room").addEventListener("change", function(){
const type = roomTypeMapping[this.value] || "1-5 Years";
document.getElementById("roomType").value = type;
});

// SAMPLE DATA
function getData(){
return [
{batch:"Tenderfeet", subject:"Linguistic"},
{batch:"Learners", subject:"Maths"},
{batch:"Advancers", subject:"Maths"},
{batch:"Learners", subject:"Games"},
{batch:"Advancers", subject:"Children Panchayat"}
];
}

// LOAD DAY
function loadDay(){

const week = parseInt(document.getElementById("weekSelect").value);
const day = parseInt(document.getElementById("daySelect").value);
const room = document.getElementById("room").value;
let type = document.getElementById("roomType").value;

// DEFAULT TYPE
if(!type){
type = "1-5 Years";
}

// VALIDATION (IMPROVED)
if(!room){
alert("Please select Yellow Room");
return;
}

if(!week || !day){
alert("Please select Week and Day");
return;
}

// GLOBAL DAY (1–24)
const globalDay = (week - 1) * 6 + day;

// 🎯 REALISTIC STRUCTURE (not random now)
let data = [];

switch(globalDay){

case 1:
data = [
{batch:"Tenderfeet", subject:"Linguistic"},
{batch:"Learners", subject:"Maths"},
{batch:"Advancers", subject:"Maths"}
];
break;

case 2:
data = [
{batch:"Learners", subject:"EVS"},
{batch:"Advancers", subject:"EVS"},
{batch:"Learners", subject:"Yoga"}
];
break;

case 3:
data = [
{batch:"Learners", subject:"Games"},
{batch:"Advancers", subject:"Children Panchayat"}
];
break;

default:
data = [
{batch:"Tenderfeet", subject:"Drawing"},
{batch:"Learners", subject:"Maths"},
{batch:"Advancers", subject:"Science"}
];
}

// TABLE
const table = document.getElementById("dailyTable");

table.innerHTML = `
<tr>
<th>Batch</th>
<th>Subject</th>
<th>Chapter</th>
<th>Index</th>
<th>Lesson</th>
</tr>
`;

// ROWS
data.forEach(d => {

let row = table.insertRow();

row.insertCell(0).innerText = d.batch;
row.insertCell(1).innerText = d.subject;

// INPUT FIELDS (better UX)
row.insertCell(2).innerHTML = `<select><option>Select Chapter</option></select>`;
row.insertCell(3).innerHTML = `<select><option>Select Index</option></select>`;
row.insertCell(4).innerText = "";

});

// DEBUG
console.log(`Room: ${room}, Type: ${type}, Week: ${week}, Day: ${day}, Global: ${globalDay}`);

}

// SAVE
function saveDay(){
alert("Saved Successfully");
}

</script>

</body>
