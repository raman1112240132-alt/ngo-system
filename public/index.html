<!DOCTYPE html>
<html>

<head>
<title>YR Lesson Plan MIS</title>
</head>

<body>

<h2>YR Lesson Plan MIS</h2>
<h4>Daily Session Tracking System</h4>

<input type="text" id="educator" placeholder="Educator Name"><br><br>

<input type="date" id="date"><br><br>

<select id="room">
<option value="">Select Yellow Room</option>
<option value="Abhay Nagar">Abhay Nagar</option>
<option value="Chinhat">Chinhat</option>
<option value="Garden Bay">Garden Bay</option>
<option value="Mannat">Mannat</option>
<option value="One world">One world</option>
</select>

<br><br>

<select id="roomType">
<option value="">Auto Filled</option>
<option value="1-5 Years">1-5 Years</option>
<option value="5-10 Years">5-10 Years</option>
<option value="10-15 Years">10-15 Years</option>
<option value="Shalimar Sites">Shalimar Sites</option>
</select>

<br><br>

<select id="daySelect">
<option value="">Select Day</option>
<option value="1">Day 1</option>
<option value="2">Day 2</option>
<option value="3">Day 3</option>
<option value="4">Day 4</option>
<option value="5">Day 5</option>
<option value="6">Day 6</option>
</select>

<button onclick="loadDay()">Load Day</button>

<br><br>

<table border="1" id="dailyTable">
<tr>
<th>Batch</th>
<th>Subject</th>
<th>Chapter</th>
<th>Index</th>
<th>Lesson</th>
</tr>
</table>

<script>

// AUTO DATE
document.getElementById("date").value =
new Date().toISOString().split("T")[0];

// ROOM TYPE AUTO
const roomTypeMapping = {
"One world":"Shalimar Sites",
"Garden Bay":"Shalimar Sites",
"Mannat":"Shalimar Sites",
"Chinhat":"10-15 Years"
};

document.getElementById("room").addEventListener("change", function(){
const type = roomTypeMapping[this.value] || "1-5 Years";
document.getElementById("roomType").value = type;
});

// SPECIAL SUBJECTS
const specialSubjects = [
"Games",
"Library session",
"Children Panchayat",
"Animal Management"
];

// NORMAL DATA
function getData(){
return [
{batch:"Tenderfeet", subject:"Linguistic"},
{batch:"Learners", subject:"Maths"},
{batch:"Advancers", subject:"Maths"},
{batch:"Learners", subject:"Games"},
{batch:"Advancers", subject:"Children Panchayat"}
];
}

// LOAD DAY
function loadDay(){

const table = document.getElementById("dailyTable");

table.innerHTML = `
<tr>
<th>Batch</th>
<th>Subject</th>
<th>Chapter</th>
<th>Index</th>
<th>Lesson</th>
</tr>
`;

const data = getData();

for(let i=0;i<data.length;i++){

let d = data[i];

let row = table.insertRow();

row.insertCell(0).innerText = d.batch;
row.insertCell(1).innerText = d.subject;

let c = row.insertCell(2);
let iCell = row.insertCell(3);
let t = row.insertCell(4);

if(specialSubjects.includes(d.subject)){
c.innerHTML = `<select><option>1</option><option>0</option></select>`;
iCell.innerText = "-";
t.innerText = "-";
}else{
c.innerText = "Select Chapter";
iCell.innerText = "Select Index";
t.innerText = "";
}

}

}

</script>

</body>
</html>
