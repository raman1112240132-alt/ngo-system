// TRANSFORM
function transform(type,data){
let x=[...data];

if(type==="1"||type==="2"){
x=x.filter(d=>d.s!=="FLN");
}

if(type==="3"){
let adv=x.filter(d=>d.b==="Advancers");
let asp=adv.map(d=>({b:"Aspirers",s:d.s}));
x=[...x,...asp];
}

if(type==="S"){
x.unshift({b:"Tenderfeet Slot 2",s:"Maths"});
}

return x;
}

// LOAD
function loadDay(){
let day=daySelect.value;
let type=roomType.value;

if(!day||!type){alert("Select type & day");return;}

let data = [];

if(type==="0"){
  data = timetable0[day] || [];
}

table.innerHTML=`<tr>
<th>Batch</th><th>Subject</th><th>Chapter</th><th>Index</th><th>Lesson</th>
</tr>`;

data.forEach(d=>{
let r=table.insertRow();
let c=d.b==="Tenderfeet"?"t":d.b==="Learners"?"l":d.b==="Advancers"?"a":"s";

r.insertCell(0).innerHTML=`<span class="badge ${c}">${d.b}</span>`;
r.insertCell(1).innerHTML=`<span class="${special.includes(d.s)?'special':''}">${d.s}</span>`;

if(special.includes(d.s)){
r.insertCell(2).innerHTML=`
<select>
  <option value="">Select</option>
  <option value="1">1</option>
  <option value="0">0</option>
</select>`;
r.insertCell(3).innerText="-";
r.insertCell(4).innerText="-";
}else{
r.insertCell(2).innerHTML='<select><option>Select Chapter</option></select>';
r.insertCell(3).innerHTML='<select><option>Select Index</option></select>';
r.insertCell(4).innerHTML='<input>';
}
});
}

// SAVE
function save(){

let educator=document.getElementById("educator").value;
let date=document.getElementById("execDate").value;

if(!educator||!date){
alert("Fill required fields");
return;
}

let rows=document.querySelectorAll("#table tr");
let data=[];

for(let i=1;i<rows.length;i++){

let c=rows[i].querySelectorAll("td");

let chapter="",index="",lesson="";

// SPECIAL SUBJECT CHECK
if(c[2].querySelector("select") && c[3].innerText==="-"){

chapter=c[2].querySelector("select").value;

if(chapter===""){
alert("Please select 1 or 0 for all special sessions");
return;
}

index="-";
lesson="-";

}else{

chapter=c[2].querySelector("select")?.value||"";
index=c[3].querySelector("select")?.value||"";
lesson=c[4].querySelector("input")?.value||"";

}

data.push({
batch:c[0].innerText,
subject:c[1].innerText,
chapter,
index,
lesson
});

}

// DOWNLOAD

a.download="YR_Data.json";

// SUCCESS UI
