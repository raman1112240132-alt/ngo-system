<!DOCTYPE html>
<html>
<head>
<title>LP.MIS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FBBF24;
  --dark:#111827;
  --mid:#374151;
  --light:#F9FAFB;
  --border:#E5E7EB;
  --tf:#DBEAFE;
  --ln:#DCFCE7;
  --av:#FCE7F3;
  --as:#EDE9FE;
  --special:#FEF3C7;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#FFFBEB;min-height:100vh;}
input:hover,select:hover{border-color:#FBBF24;background:#FFFDF5;}
.card{transition:box-shadow .2s;}
.card:hover{box-shadow:0 4px 20px rgba(251,191,36,0.18);}
tr:not(:first-child):hover td{filter:brightness(0.95);cursor:default;}
.btn-load:hover{background:#F59E0B;transform:translateY(-1px);box-shadow:0 4px 12px rgba(251,191,36,0.4);}
.btn-save:hover{background:#15803D;transform:translateY(-1px);box-shadow:0 4px 12px rgba(22,163,74,0.35);}
header{
  background:var(--dark);
  color:#fff;
  padding:18px 30px;
  display:flex;
  align-items:center;
  gap:14px;
}
header .logo{
  font-family:'Space Mono',monospace;
  font-size:20px;
  color:var(--yellow);
  letter-spacing:1px;
}
header .sub{font-size:13px;color:#9CA3AF;margin-top:2px;}
.wrap{max-width:960px;margin:32px auto;padding:0 16px;}
.card{
  background:#fff;
  border-radius:var(--radius);
  box-shadow:0 2px 12px rgba(0,0,0,0.07);
  padding:24px;
  margin-bottom:20px;
}
.card-title{
  font-family:'Space Mono',monospace;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.5px;
  color:#6B7280;
  margin-bottom:16px;
}
.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:12px;
}
label.field{display:flex;flex-direction:column;gap:5px;}
label.field span{font-size:12px;font-weight:600;color:var(--mid);}
input,select{
  padding:9px 12px;
  border-radius:8px;
  border:1.5px solid var(--border);
  font-family:'DM Sans',sans-serif;
  font-size:13px;
  background:#fff;
  color:var(--dark);
  transition:border-color .15s;
  width:100%;
}
input:focus,select:focus{outline:none;border-color:var(--yellow);}
.btn-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
.btn{
  padding:10px 22px;
  border:none;
  border-radius:8px;
  font-family:'DM Sans',sans-serif;
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  transition:opacity .15s,transform .1s;
}
.btn:active{transform:scale(0.97);}
.btn:hover{opacity:.88;}
.btn-load{background:var(--yellow);color:var(--dark);}
.btn-save{background:#16A34A;color:#fff;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  background:var(--dark);
  color:var(--yellow);
  padding:11px 10px;
  text-align:left;
  font-size:11px;
  font-family:'Space Mono',monospace;
  letter-spacing:.5px;
  white-space:nowrap;
}
td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr.tf td:first-child{border-left:4px solid #3B82F6;}
tr.ln td:first-child{border-left:4px solid #22C55E;}
tr.av td:first-child{border-left:4px solid #EC4899;}
tr.as td:first-child{border-left:4px solid #8B5CF6;}
tr.tf{background:var(--tf);}
tr.ln{background:var(--ln);}
tr.av{background:var(--av);}
tr.as{background:var(--as);}
tr.special{background:var(--special);}
tr.special td:first-child{border-left:4px solid var(--yellow);}
.batch-pill{
  display:inline-block;
  padding:3px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
}
.pill-tf{background:#3B82F6;color:#fff;}
.pill-ln{background:#22C55E;color:#fff;}
.pill-av{background:#EC4899;color:#fff;}
.pill-as{background:#8B5CF6;color:#fff;}
.pill-sp{background:var(--yellow);color:var(--dark);}
td select,td input[type="text"]{
  border:1.5px solid #D1D5DB;
  font-size:12px;
  padding:6px 8px;
}
td select:focus,td input:focus{border-color:#6366F1;}
.toast{
  position:fixed;bottom:28px;right:28px;
  background:#16A34A;color:#fff;
  padding:14px 22px;
  border-radius:10px;
  font-weight:700;
  font-size:14px;
  box-shadow:0 4px 18px rgba(0,0,0,0.18);
  display:none;
  z-index:999;
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.leg-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mid);}
.leg-dot{width:10px;height:10px;border-radius:50%;}
.flag{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:20px;
  font-size:12px;font-weight:700;letter-spacing:.3px;
  animation:popIn .25s ease;
}
.flag-late{background:#FEF2F2;color:#DC2626;border:1.5px solid #FECACA;}
.flag-incomplete{background:#FFF7ED;color:#C2410C;border:1.5px solid #FED7AA;}
#tableWrap{overflow-x:auto;}
/* Incomplete fields modal */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.45);z-index:1000;
  align-items:center;justify-content:center;
}
.modal-overlay.active{display:flex;}
.modal-box{
  background:#fff;border-radius:14px;padding:28px 32px;
  max-width:420px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,0.18);
  animation:popIn .2s ease;
}
@keyframes popIn{from{transform:scale(0.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal-icon{font-size:32px;margin-bottom:10px;}
.modal-title{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;color:var(--dark);margin-bottom:8px;}
.modal-body{font-size:13px;color:#6B7280;line-height:1.6;margin-bottom:20px;}
.modal-body ul{margin:8px 0 0 16px;}
.modal-body li{margin-bottom:4px;}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;}
.modal-btn-cancel{padding:9px 18px;border:1.5px solid var(--border);border-radius:8px;background:#fff;font-family:'DM Sans',sans-serif;font-weight:600;font-size:13px;cursor:pointer;}
.modal-btn-cancel:hover{background:#F9FAFB;}
.modal-btn-submit{padding:9px 18px;border:none;border-radius:8px;background:#16A34A;color:#fff;font-family:'DM Sans',sans-serif;font-weight:700;font-size:13px;cursor:pointer;}
.modal-btn-submit:hover{background:#15803D;}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">LP · MIS</div>

<div id="restoreBanner" style="display:none;background:#FEF3C7;border-bottom:2px solid #FBBF24;padding:10px 30px;font-size:13px;font-family:'DM Sans',sans-serif;color:#92400E;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">

  <!-- SESSION INFO -->

          <option>Khazoor Gaon</option><option>Kumharan</option><option>Kutubpur</option>
          <option>Laulai</option><option>Macchli Mohal</option><option>Mahmoodpur</option>
          <option>Malhaur</option><option>Mannat</option><option>Matiyari</option>
          <option>Meesa</option><option>Mozzam Nagar</option><option>Munshipulia</option>
          <option>Nanda Kheda</option><option>Nat Kheda</option><option>Noida Sec 122</option>
          <option>Noida Sec 17</option><option>One world</option><option>Pani Gaon</option>

    </div>
  </div>
</div>

<div class="toast" id="toast">✅ Saved Successfully!</div>

<script>
// ── INIT ──
window.onload = function(){
  const today = new Date();
  const todayStr = today.toISOString().split("T")[0];
  // Human-readable locked display
  const fmt = today.toLocaleDateString("en-IN",{weekday:"short",day:"2-digit",month:"short",year:"numeric"});
  document.getElementById("todayDisplay").value = fmt;
  document.getElementById("todayDisplay").dataset.iso = todayStr; // store ISO for comparison
  document.getElementById("execDate").value = todayStr;
  sortRooms();
  try {
    const last = JSON.parse(localStorage.getItem("lastSession"));
    if(last){
      const typeLabel = {"0":"0 Yrs","1":"1–5 Yrs","2":"5–10 Yrs","3":"10–15 Yrs","S":"Shalimar"};
      document.getElementById("restoreInfo").innerText =
        `${last.educator} · ${last.room} · ${typeLabel[last.roomType]||last.roomType} · ${last.execDate} (${last.payload.length} rows)`;
      document.getElementById("restoreBanner").style.display = "flex";
    }
  } catch(e){}
};

// ── LATE SUBMISSION FLAG ──
function checkLateSubmission(){
  const todayStr = document.getElementById("todayDisplay").dataset.iso;
  const execDate = document.getElementById("execDate").value;
  updateFlags(todayStr, execDate);
}

// ── INCOMPLETE FLAG (called after loadDay) ──
function checkIncompleteFlag(){
  const rows = document.querySelectorAll("#table tr");
  const todayStr = document.getElementById("todayDisplay").dataset.iso;
  const execDate = document.getElementById("execDate").value;
  updateFlags(todayStr, execDate, rows.length > 1);
}

function updateFlags(todayStr, execDate, tableLoaded){
  const flagsRow = document.getElementById("flagsRow");
  flagsRow.innerHTML = "";
  if(execDate && execDate < todayStr){
    flagsRow.innerHTML += `<span class="flag flag-late">🕐 Late Submission — execution date is in the past</span>`;
  }
  if(tableLoaded){
    const rows = document.querySelectorAll("#table tr");
    let missing = 0;
    for(let i=1;i<rows.length;i++){
      const cells = rows[i].cells;
      const subject = cells[1]?.innerText?.trim();
      if(SPECIALS.has(subject)){
        const v = cells[2]?.querySelector("select")?.value;
        if(!v) missing++;
      } else {
        const ch = cells[2]?.querySelector("select")?.value;
        const idx = cells[3]?.querySelector("select")?.value;
        if(!ch||!idx) missing++;
      }
    }
    if(missing > 0){
      flagsRow.innerHTML += `<span class="flag flag-incomplete">⚠️ ${missing} incomplete entr${missing>1?"ies":"y"} detected</span>`;
    }
  }
}

function restoreLastSession(){
  try {
    const last = JSON.parse(localStorage.getItem("lastSession"));
    if(!last) return;
    document.getElementById("educator").value = last.educator;
    document.getElementById("room").value = last.room;
    document.getElementById("roomType").value = last.roomType;
    document.getElementById("execDate").value = last.execDate;
    document.getElementById("restoreBanner").style.display = "none";
    alert("✅ Session info restored! Select Week & Day, then Load Day to continue.");
  } catch(e){}
}

function sortRooms(){
  const dd = document.getElementById("room");
  const opts = Array.from(dd.options).slice(1).sort((a,b)=>a.text.localeCompare(b.text));
  dd.innerHTML = '<option value="">Select Room</option>';
  opts.forEach(o=>dd.add(o));
}

// ── AUTO ROOM TYPE ──
const roomMap = {
  "Malhaur":"3","Chinhat":"3","Munshipulia":"3",
  "Ismailganj":"2","Garden Bay":"S","Mannat":"S","One world":"S"
};
document.getElementById("room").addEventListener("change",function(){
  document.getElementById("roomType").value = roomMap[this.value] || "1";
});

// ── WEEK → DAY ──
document.getElementById("weekSelect").addEventListener("change",function(){
  const week = parseInt(this.value);
  const dd = document.getElementById("daySelect");
  dd.innerHTML = '<option value="">Select Day</option>';
  if(!week) return;
  const start = (week-1)*6+1;
  for(let i=0;i<6;i++) dd.innerHTML += `<option value="${start+i}">Day ${start+i}</option>`;
});

const TF = s => ({b:"Tenderfeet",s});
const LN = s => ({b:"Learners",s});

// ── SPECIAL SESSIONS ──

// ── SUBJECT DATA ──
// Add more subjects/chapters/indices here as your curriculum grows

// ── TIMETABLES ──
const timetable0 = {

// ── LOAD DAY ──
function loadDay(){
  const day = parseInt(document.getElementById("daySelect").value);
  const type = document.getElementById("roomType").value;
  if(!day || !type){ alert("Please select Room Type and Day"); return; }

  const maps = {"0":timetable0,"1":timetable1_5,"2":timetable5_10,"3":timetable10};
  const data = maps[type] ? maps[type][day] : [];
  if(!data || data.length===0){ alert("No timetable found for this selection"); return; }

  const batchClass = {"Tenderfeet":"tf","Learners":"ln","Advancers":"av","Aspirers":"as"};
  const pillClass  = {"Tenderfeet":"pill-tf","Learners":"pill-ln","Advancers":"pill-av","Aspirers":"pill-as"};

  const table = document.getElementById("table");
  table.innerHTML = `<tr><th>Batch</th><th>Subject</th><th>Chapter</th><th>Index</th><th>Lesson</th></tr>`;

  data.forEach((d,i)=>{
    const row = table.insertRow();
    const isSpecial = SPECIALS.has(d.s);
    row.classList.add(isSpecial ? "special" : (batchClass[d.b]||""));

    row.insertCell(0).innerHTML = `<span class="batch-pill ${isSpecial?'pill-sp':(pillClass[d.b]||'')}">${d.b}</span>`;
    row.insertCell(1).innerText = d.s;

    if(isSpecial){
      const td = row.insertCell(2);
      td.innerHTML = `<select onchange="checkIncompleteFlag()"><option value="">Select</option><option value="1">1</option><option value="0">0</option></select>`;
      row.insertCell(3).innerHTML = `<span style="color:#9CA3AF">—</span>`;
      row.insertCell(4).innerHTML = `<span style="color:#9CA3AF">—</span>`;
    } else {
      const chData = subjectData[d.s] || null;
      let chapterHTML = `<select onchange="updateIndex(this);checkIncompleteFlag()"><option value="">Select</option>`;
      if(chData){
        Object.keys(chData).forEach(ch=>{ chapterHTML += `<option value="${ch}">${ch}</option>`; });
      } else {
        chapterHTML += `<option value="General">General</option>`;
      }
      chapterHTML += `</select>`;
      row.insertCell(2).innerHTML = chapterHTML;
      row.insertCell(3).innerHTML = `<select onchange="updateLesson(this);checkIncompleteFlag()"><option value="">Select</option></select>`;
      row.insertCell(4).innerHTML = `<input type="text" placeholder="Auto-filled" style="width:100%">`;
    }
  });
  checkIncompleteFlag();
}

// ── UPDATE INDEX ──
function updateIndex(chSel){
  const row = chSel.closest("tr");
  const subject = row.cells[1].innerText;
  const chapter = chSel.value;
  const idxSel = row.cells[3].querySelector("select");
  idxSel.innerHTML = `<option value="">Select</option>`;
  const chData = subjectData[subject];
  if(chData && chData[chapter]){
    Object.keys(chData[chapter]).forEach(idx=>{
      idxSel.innerHTML += `<option value="${idx}">${idx}</option>`;
    });
  }
}

// ── UPDATE LESSON ──
function updateLesson(idxSel){
  const row = idxSel.closest("tr");
  const subject = row.cells[1].innerText;
  const chapter = row.cells[2].querySelector("select")?.value;
  const idx = idxSel.value;
  const lessonInput = row.cells[4].querySelector("input");
  if(lessonInput && subjectData[subject]?.[chapter]?.[idx]){
    lessonInput.value = subjectData[subject][chapter][idx];
  }
}

// ── BUILD PAYLOAD (shared by save + submitAnyway) ──
let _pendingPayload = null;

function buildPayload(){
  const educator = document.getElementById("educator").value.trim();
  const room = document.getElementById("room").value;
  const execDate = document.getElementById("execDate").value;
  const roomType = document.getElementById("roomType").value;

  if(!educator || !room || !execDate){
    alert("Please fill Educator Name, Room, and Execution Date");
    return null;
  }
  const rows = document.querySelectorAll("#table tr");
  if(rows.length <= 1){ alert("No lesson plan loaded. Please load a day first."); return null; }

  // Silent timestamp — captured without showing to educator
  const submittedAt = new Date().toISOString();
  const todayStr = document.getElementById("todayDisplay").dataset.iso;
  const isLate = execDate < todayStr;

  const payload = [];
  const incomplete = [];

  for(let i=1; i<rows.length; i++){
    const cells = rows[i].cells;
    const batch = cells[0].innerText.trim();
    const subject = cells[1].innerText.trim();
    const base = {
      educator_name: educator, level: roomType, batch,
      subject, session_date: execDate, yellow_room: room,
      slot_number: i,
      _submitted_at: submittedAt,  // silent
      _is_late: isLate             // silent
    };

    if(SPECIALS.has(subject)){
      const chSel = cells[2].querySelector("select");
      const val = chSel ? chSel.value : "";
      if(!val) incomplete.push(`Row ${i}: ${subject} (${batch}) — not marked`);
      payload.push({...base, chapter_name: val || "NA", index_code:"NA", lesson:"NA"});
      continue;
    }

    const chSel = cells[2].querySelector("select");
    const chapter = chSel ? chSel.value : "";
    const idxSel = cells[3].querySelector("select");
    const index = idxSel ? idxSel.value : "";
    const lessonEl = cells[4].querySelector("input");
    const lesson = lessonEl ? lessonEl.value.trim() : "";

    if(!chapter || !index) incomplete.push(`${subject} (${batch}) — Chapter / Index missing`);
    payload.push({...base, chapter_name: chapter||"NA", index_code: index||"NA", lesson: lesson||"NA"});
  }

  return { educator, room, roomType, execDate, payload, incomplete };
}

// ── SAVE ──
function save(){
  const result = buildPayload();
  if(!result) return;
  const { educator, room, roomType, execDate, payload, incomplete } = result;

  if(incomplete.length > 0){
    // Show modal listing what's missing
    const list = incomplete.map(m=>`<li>${m}</li>`).join("");
    document.getElementById("modalBody").innerHTML =
      `<strong>${incomplete.length} area(s)</strong> are not fully filled:<ul>${list}</ul><br>Do you still want to submit?`;
    _pendingPayload = { educator, room, roomType, execDate, payload };
    document.getElementById("incompleteModal").classList.add("active");
    return;
  }

  _pendingPayload = { educator, room, roomType, execDate, payload };
  dispatch();
}

function closeModal(){
  document.getElementById("incompleteModal").classList.remove("active");
  _pendingPayload = null;
}

function submitAnyway(){
  document.getElementById("incompleteModal").classList.remove("active");
  dispatch();
}

function dispatch(){
  if(!_pendingPayload) return;
  const { educator, room, roomType, execDate, payload } = _pendingPayload;

  try { localStorage.setItem("lastSession", JSON.stringify({educator, room, roomType, execDate, payload})); } catch(e){}

  const btn = document.querySelector(".btn-save");
  btn.innerText = "Saving...";
  btn.disabled = true;

  Promise.all(payload.map(row =>
    fetch("/add-session",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(row)
    })
  ))
  .then(()=>{
    btn.innerText = "💾 Save Full Day";
    btn.disabled = false;
    _pendingPayload = null;
    const toast = document.getElementById("toast");
    toast.style.display = "block";
    setTimeout(()=>{ toast.style.display="none"; }, 2500);
  })
  .catch(()=>{
    btn.innerText = "💾 Save Full Day";
    btn.disabled = false;
    alert("⚠️ Error saving data. Please check your connection and try again.");
  });
}
