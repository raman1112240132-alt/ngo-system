<script>

// AUTO DATE
document.getElementById("date").value =
new Date().toISOString().split("T")[0];

// =============================
// ROOM TYPE AUTO
// =============================
const roomTypeMapping = {

"One world":"Shalimar Sites",
"Garden Bay":"Shalimar Sites",
"Mannat":"Shalimar Sites",

"Chinhat":"10-15 Years",
"Malhaur":"10-15 Years",
"Munshipulia":"10-15 Years",

"Ismailganj":"5-10 Years"

};

document.getElementById("room").addEventListener("change", function(){

const type = roomTypeMapping[this.value] || "1-5 Years";
document.getElementById("roomType").value = type;

});

// =============================
// SPECIAL SUBJECTS (1/0)
// =============================
const specialSubjects = [
"Games",
"Library session",
"Children Panchayat",
"Animal Management",
"Padho Padhao",
"PTM"
];

// =============================
// SHALIMAR TIMETABLE
// =============================
function getShalimarDay(day){

return [
{batch:"Tenderfeet", subject:"Linguistic"},
{batch:"Learners", subject:"Maths"},
{batch:"Advancers", subject:"Maths"},

{batch:"Learners", subject:"Library session"},

{batch:"Advancers", subject:"WHY"},
{batch:"Advancers", subject:"GA"}
];

}

// =============================
// NORMAL TIMETABLE
// =============================
function getNormalDay(day){

return [
{batch:"Tenderfeet", subject:"Linguistic"},
{batch:"Learners", subject:"Maths"},
{batch:"Advancers", subject:"Maths"},

{batch:"Learners", subject:"Games"},

{batch:"Advancers", subject:"Children Panchayat"},
{batch:"Advancers", subject:"Animal Management"}
];

}

// =============================
// LOAD DAY (FINAL WORKING)
// =============================
async function loadDay(){

const day = parseInt(document.getElementById("daySelect").value);
const type = document.getElementById("roomType").value;

if(!day || !type){
alert("Select Room Type & Day");
return;
}

let data = [];

if(type === "Shalimar Sites"){
data = getShalimarDay(day);
}else{
data = getNormalDay(day);
}

const table = document.getElementById("dailyTable");

// ✅ ONLY HEADER (NOT TABLE)
table.innerHTML = `
<tr>
<th>Batch</th>
<th>Subject</th>
<th>Chapter</th>
<th>Index</th>
<th>Lesson</th>
</tr>
`;

// ADD ROWS
for(let i=0;i<data.length;i++){

let d = data[i];

let row = table.insertRow();

row.insertCell(0).innerText = d.batch;
row.insertCell(1).innerText = d.subject;

let chapterCell = row.insertCell(2);
let indexCell = row.insertCell(3);
let lessonCell = row.insertCell(4);

// SPECIAL SUBJECT → 1/0
if(specialSubjects.includes(d.subject)){

let select = document.createElement("select");

select.innerHTML = `
<option value="">Select</option>
<option value="1">1</option>
<option value="0">0</option>
`;

chapterCell.appendChild(select);
indexCell.innerText = "-";
lessonCell.innerText = "-";

}

// NORMAL SUBJECT
else{

let chapter = document.createElement("select");
let index = document.createElement("select");

chapterCell.appendChild(chapter);
indexCell.appendChild(index);

chapter.innerHTML = "<option>Select Chapter</option>";
index.innerHTML = "<option>Select Index</option>";

lessonCell.innerText = "";

}

}

}

// =============================
// SAVE
// =============================
async function saveDay(){
alert("Saved Successfully");
}

</script>
